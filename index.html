<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()">
    <title>צריכות 113</title>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tzrihot113" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/style/GATR_Tube.css" />
    <link rel="stylesheet" href="/style/natal.css" />
    <link rel="stylesheet" href="/style/style.css" />
    <link rel="stylesheet" href="/style/side_navbar_style.css">
    <link rel="stylesheet" href="/style/location_switch_style.css">
    <script src="/scripts/auth.js"></script>
</head>

<body dir="rtl">

    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="toggleSideNav()">&times;</a>
        <a href="/" id="nav-home">דף הבית</a>
        <!-- <a href="pages/reports.html">דוחות</a> -->
        <div class="admin-logout">
            <a href="#" onclick="checkCredentials()">עמוד מנהל</a>
            <button type="button" class="btn btn-outline-info" id="logoutBtn" onclick="adminLogout()">התנתק</button>
        </div>
    </div>

    <div class="banner-wrapper">
        <img src="/assets/Banner113.png" class="banner" />
    </div>

    <div class="appbar">
        <!-- <div class="hamburger" onclick="toggleSideNav()">
            <span></span>
            <span></span>
            <span></span>
        </div> -->

    </div>



    <div class="heli-container container input-group mb-3">
        <input id="heli_number" class="form-control" type="number" inputmode="numeric" placeholder="מספר מסוק">
    </div>

    <div class="container mb-3">
        <div class="location-toggle-wrap">
            <div class="location-legend">מיקום</div>
            <div class="location-options">
                <span>רמת דוד</span>
                <label for="location" class="location-switch">
                    <input name="location" type="checkbox" id="location">
                    <span class="slider round"></span>
                </label>
                <span>רמון</span>
            </div>
            
        </div>
    </div>

    <h3>טילים</h4>
        <div class="missile-container container mb-3">

            <button id="add_missile_btn" class="btn btn-primary boxshadow" type="button">הוסף טיל</button>

            <button id="toggle_gatr_missile_btn" class="btn btn-primary boxshadow" type="button">הוספת טילי
                פיגיון</button>

            <div class="gatr-container">
                <h6>בחירת טילי פיגיון</h6>
                <div class="outer-circle">
                    <div class="row-1 row">
                        <div class="inner-circle inner-circle-10" data-tube="11"></div>
                        <div class="inner-circle inner-circle-8" data-tube="8"></div>
                        <div class="inner-circle inner-circle-11" data-tube="10"></div>
                    </div>
                    <div class="row-2 row">
                        <div class="inner-circle inner-circle-12" data-tube="13"></div>
                        <div class="inner-circle inner-circle-6" data-tube="4"></div>
                        <div class="inner-circle inner-circle-4" data-tube="6"></div>
                        <div class="inner-circle inner-circle-13" data-tube="12"></div>

                    </div>
                    <div class="row-3 row">
                        <div class="inner-circle inner-circle-14" data-tube="15"></div>
                        <div class="inner-circle inner-circle-3" data-tube="2"></div>
                        <div class="inner-circle inner-circle-1" data-tube="1"></div>
                        <div class="inner-circle inner-circle-2" data-tube="3"></div>
                        <div class="inner-circle inner-circle-15" data-tube="14"></div>

                    </div>
                    <div class="row-4 row">
                        <div class="inner-circle inner-circle-16" data-tube="17"></div>
                        <div class="inner-circle inner-circle-5" data-tube="7"></div>
                        <div class="inner-circle inner-circle-7" data-tube="5"></div>
                        <div class="inner-circle inner-circle-17" data-tube="16"></div>

                    </div>
                    <div class="row-5 row">
                        <div class="inner-circle inner-circle-18" data-tube="19"></div>
                        <div class="inner-circle inner-circle-9" data-tube="9"></div>
                        <div class="inner-circle inner-circle-19" data-tube="18"></div>

                    </div>
                </div>
                <div id="gatr_inputs">

                </div>
            </div>


        </div>

        <h3>מוץ/נורים</h3>
        <div class="ew-container container input-group">
            <button id="ew_btn" class="btn btn-primary boxshadow" type="button">הוסף מוץ/נורים</button>
        </div>

        <h3>פגזים</h3>
        <div class="cartridges-container container">
            <button id="cartridge_btn" class="btn btn-primary boxshadow" type="button">הוסף פגזים</button>
        </div>

        <h3>השלמות</h3>
        <div class="completion-container container">
            <button id="add_missile_completion_btn" class="btn btn-primary boxshadow" type="button">הוסף טיל</button>
        </div>


        <div class="notes-container">
            <textarea class="form-control boxshadow" id="notes" placeholder="הערות"></textarea>
        </div>

        <div class="share-container">
            <div id="whatsapp-container" class="border rounded">
                <img id="whatsapp_share" src="/assets/whatsapp-logo.png" id="whatsapp_btn" alt="whatsapp-logo" width="65"
                    height="65">
                <label>שיתוף ל Whatsapp</label>
            </div>
            <div id="telegram-container" class="border rounded">
                <img id="telegram-share" src="/assets/telegram-logo.png" id="telegram_btn" alt="telegram-logo" width="65"
                    height="65">
                <label>שיתוף ל Telegram</label>
            </div>
        </div>


        <button id="clear_btn" type="button" class="btn btn-secondary">איפוס נתונים</button>

        <!-- <button id="clear_memory_btn" type="button" class="btn btn-danger">מחיקת זיכרון</button> -->


        <script src="/scripts/dom_elements.js"></script>
        <script src="/scripts/add_scripts.js"></script>
        <script src="/scripts/utils.js"></script>
        <script src="/scripts/localStorageHandler.js"></script>
        <script src="/scripts/constants.js"></script>
        <script src="/scripts/apply_flavor.js"></script>
        <script type="module" src="/scripts/script.js"></script>
        <script src="/scripts/gatr.js"></script>
        <script src="/scripts/side_navbar.js"></script>
</body>

</html>
